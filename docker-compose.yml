# Noeud complet Radthal.
#   1) cp env.example .env   puis edite .env
#   2) docker compose up -d --build
services:
  radthal:
    build:
      context: .
      args:
        JOBS: ${BUILD_JOBS:-2}
    image: radthal:latest
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "9333:9333"            # le reseau P2P. Le RPC reste prive.
      # Pages web (service "interface" plus bas) : par defaut visibles seulement depuis ce PC.
      # Pour les voir depuis un autre appareil du reseau, mets UI_BIND=0.0.0.0 dans .env (voir env.example).
      - "${UI_BIND:-127.0.0.1}:3777-3782:3777-3782"
    volumes:
      - radthal-data:/data
    command:
      - bitcoind
      - -datadir=/data
      - -printtoconsole
      - -dnsseed=0             # pas de serveurs DNS : Radthal n'en a pas (pour l'instant)
      - -fixedseeds=0
      - -maxtipage=315360000   # le noeud ne se croit jamais "en synchronisation initiale" apres une longue coupure : les mineurs peuvent repartir
      - -minimumchainwork=000000000000000000000000000000000000000000000000278424e424e42244   # ...mais un noeud neuf reste "en synchronisation" tant qu'il n'a pas rattrape la chaine (valeur du 25/10/2026)
      - -addnode=${SEED_NODE:?Renseigne SEED_NODE dans le fichier .env (voir env.example)}

  # Surveillance : alerte si la chaine se bloque, est reecrite, se divise, ou si le noeud est isole.
  # Elle partage le reseau du noeud (aucun port a ouvrir) et lit son cookie RPC en lecture seule.
  watch:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: "service:radthal"
    depends_on:
      - radthal
    user: "1000:1000"
    volumes:
      - ./watch/radthal_watch.py:/app/radthal_watch.py:ro
      - radthal-data:/data:ro
    environment:
      RPC_URL: http://127.0.0.1:8332
      RPC_COOKIE: /data/.cookie
      NTFY_URL: ${NTFY_URL:-}
      STALL_MINUTES: ${STALL_MINUTES:-120}
      TIPS_CHECK_MINUTES: ${TIPS_CHECK_MINUTES:-10}
    command: ["python", "-u", "/app/radthal_watch.py"]

  # Pages web : noeud (3777), tableau de bord (3778), mempool (3779), portefeuille (3781), horodatage (3782).
  # Elles partagent le reseau du noeud (les ports sont publies par le service "radthal" ci-dessus) et lisent son cookie RPC en lecture seule.
  interface:
    build: ./interface
    image: radthal-interface:latest
    restart: unless-stopped
    network_mode: "service:radthal"
    depends_on:
      - radthal
    user: "1000:1000"
    volumes:
      - radthal-data:/data:ro
      - radthal-ui:/state
    environment:
      DEVICE: pc
      DOWN_HINT: "(dans un terminal : sudo docker compose up -d)"
      RPC: http://127.0.0.1:8332
      PASSFILE: /data/.cookie
      WALLET: ${WALLET_NAME:-monportefeuille}
      BACKUP_DIR: /data
      BACKUP_SHOW: "/data (volume Docker radthal_radthal-data)"
      STATE_DIR: /state
      STATE_SHOW: "/state (volume Docker radthal_radthal-ui)"
      VIEWS: ${UI_VIEWS:-node,dashboard,mempool,wallet,stamp}
      SHOW_PEER_ADDR: ${SHOW_PEER_ADDR:-0}
      PEER_NAMES: ${PEER_NAMES:-}
      SEED_NODE: ${SEED_NODE:-}

volumes:
  radthal-data:
  radthal-ui:
